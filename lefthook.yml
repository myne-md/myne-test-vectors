# Lefthook config — myne-test-vectors.
# Install once per clone:  brew install lefthook && lefthook install
# Skip ad-hoc:             LEFTHOOK=0 git commit ...   (or  git commit --no-verify)
#
# This repo is the cross-implementation byte-level conformance source.
# Hooks here protect JSON well-formedness and the usual text hygiene.

pre-commit:
  parallel: true
  commands:

    whitespace:
      run: git diff --cached --check

    json-validate:
      glob: "*.json"
      # jq exits non-zero on invalid JSON; "empty" consumes input without output.
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if ! jq empty "$f" >/dev/null 2>&1; then
            echo "invalid JSON: $f"
            jq empty "$f"
            fail=1
          fi
        done
        exit $fail

    eof-newline:
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if [ -n "$(tail -c1 "$f")" ]; then
            echo "missing EOF newline: $f"
            fail=1
          fi
        done
        exit $fail

    secret-scan:
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|aws_secret_access_key[[:space:]]*=' "$f" >/dev/null; then
            echo "secret-like pattern in: $f"
            grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|aws_secret_access_key[[:space:]]*=' "$f"
            fail=1
          fi
        done
        exit $fail

# JSON-Schema conformance gate — automates the previously-MANUAL ajv step
# documented in README.md ("Every cases.json must validate clean").
#
# Validated PER CATEGORY (single -d each), never all -d in one ajv run: a
# combined run mis-reports vault-prefs as invalid (a oneOf artefact).
#
# The sub-schemas go in as ONE QUOTED GLOB, which ajv expands internally. This
# is not a tidier spelling of a -r-per-file loop — that loop never worked.
# `ajv-cli` 5 accepts exactly one -r and rejects a second outright with
# `invalid syntax (too many arguments)`, so with 51 sub-schemas EVERY category
# failed, and the gate's own message ("INVALID against schema: <file>") named
# the vector files rather than the command that could not run. A gate that
# cannot pass is a gate that gets bypassed. `.woodpecker.yml` has always used
# the glob and says why; keep the two in step (README.md + CLAUDE.md carry the
# same command for humans).
#
# `npx -y ajv-cli@5` downloads on each run (slow/network) — acceptable at
# pre-push for the conformance source of truth.
pre-push:
  parallel: false
  commands:
    ajv-schema:
      run: |
        fail=0
        for d in vectors/*/v0.1/cases.json; do
          if ! npx -y ajv-cli@5 validate -s schema/v0.1.json -r "schema/v0.1/*.json" -d "$d" --spec=draft2020 >/dev/null 2>&1; then
            echo "INVALID against schema: $d"
            fail=1
          fi
        done
        [ "$fail" -eq 0 ] && echo "all $(ls vectors/*/v0.1/cases.json | wc -l | tr -d ' ') cases.json valid"
        exit $fail

# Reject accidental AI co-author / attribution trailers in commit messages
# (project policy). Lefthook passes the commit-message file path as {1}.
commit-msg:
  commands:
    no-ai-coauthor:
      run: |
        if grep -qiE 'Co-Authored-By:.*(Claude|Anthropic)|Generated with .*Claude|🤖 Generated' "{1}"; then
          echo "commit message carries an AI co-author/attribution trailer — remove it (project policy)."
          exit 1
        fi
