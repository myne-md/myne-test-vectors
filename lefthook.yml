# Lefthook config — myne-test-vectors.
# Install once per clone:  brew install lefthook && lefthook install
# Skip ad-hoc:             LEFTHOOK=0 git commit ...   (or  git commit --no-verify)
#
# This repo is the cross-implementation byte-level conformance source.
# Hooks here protect JSON well-formedness and the usual text hygiene.

pre-commit:
  parallel: true
  commands:

    whitespace:
      run: git diff --cached --check

    json-validate:
      glob: "*.json"
      # jq exits non-zero on invalid JSON; "empty" consumes input without output.
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if ! jq empty "$f" >/dev/null 2>&1; then
            echo "invalid JSON: $f"
            jq empty "$f"
            fail=1
          fi
        done
        exit $fail

    eof-newline:
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if [ -n "$(tail -c1 "$f")" ]; then
            echo "missing EOF newline: $f"
            fail=1
          fi
        done
        exit $fail

    secret-scan:
      run: |
        fail=0
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file --mime "$f" | grep -q 'charset=binary'; then continue; fi
          if grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|aws_secret_access_key[[:space:]]*=' "$f" >/dev/null; then
            echo "secret-like pattern in: $f"
            grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|AKIA[A-Z0-9]{16}|aws_secret_access_key[[:space:]]*=' "$f"
            fail=1
          fi
        done
        exit $fail
